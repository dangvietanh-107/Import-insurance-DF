<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Chuyển đổi dữ liệu thuốc BHYT</title><link rel="stylesheet" href="style.css"></head><body><main class="card" aria-busy="false"><h1>Tool chuyển đổi dữ liệu thuốc BHYT</h1><p class="intro">Chọn file Excel hoặc CSV; dữ liệu chỉ được xử lý trên máy của bạn.</p><label class="file-label" for="inputFile">File Input (.xlsx, .xls, .csv)</label><input id="inputFile" type="file" accept=".xlsx,.xls,.csv"><div class="file-info"><span id="fileState" class="file-state idle">Chưa chọn file</span><span id="fileName" class="muted">Chưa chọn file.</span></div><div class="mapping-inputs"><label for="startingMavattu">MAVATTU bắt đầu</label><input id="startingMavattu" type="number" step="1" inputmode="numeric" required><label for="manhomvattu">MANHOMVATTU</label><input id="manhomvattu" type="number" step="1" inputmode="numeric" required></div><div class="actions"><button id="processButton" type="button">XỬ LÝ</button><button id="resetButton" class="secondary" type="button">RESET</button></div><section class="status-panel" aria-live="polite"><h2>Trạng thái</h2><p id="status">Đang chờ file...</p></section><section id="result" class="result" hidden><h2>Kết quả</h2><p>Tổng dòng Input: <strong id="inputCount">0</strong></p><p>Đã xử lý: <strong id="outputCount">0</strong></p><p>Lỗi/cảnh báo: <strong id="errorCount">0</strong></p><button id="downloadButton" type="button" disabled>TẢI FILE OUTPUT</button><details id="warningsBox" hidden><summary>Chi tiết lỗi/cảnh báo</summary><ul id="warnings"></ul></details></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script type="module" src="js/app.js"></script></body></html>
